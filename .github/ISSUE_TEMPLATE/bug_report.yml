name: Bug report
description: Report a reproducible problem in Anlyflad
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first, and do
        not include private data, secrets, or copyrighted images.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or UI steps, including the input file and settings.
      placeholder: |
        1. java -jar app/target/anlyflad.jar ...
        2. Set raster mode / vector mode / quality ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces, or screenshots.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Component
      options:
        - Core library
        - CLI
        - Desktop (Swing)
        - Web (TeaVM)
        - All-in-one JAR
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: vector-mode
    attributes:
      label: Vector mode
      options:
        - curve
        - contour
        - exact
        - not applicable
    validations:
      required: true
  - type: input
    id: quality
    attributes:
      label: Quality scale or settings
      description: Quality 0-100, supersample, output scale, or stage overrides.
      placeholder: "50, auto supersample, output scale 1"
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, JDK version, and browser when relevant.
      placeholder: "Windows 11, JDK 25, Chrome 140"
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input details
      description: Format, dimensions, file size, and whether the input can be shared.
  - type: textarea
    id: context
    attributes:
      label: Additional context
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest `main`.
          required: true
        - label: I have not included secrets or private data.
          required: true
