<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Language" content="en">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#25231f">
<title>Anlyflad Documentation</title>
<style>
  @font-face{font-family:'Noto Sans';src:url('fonts/NotoSans-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Noto Sans';src:url('fonts/NotoSans-500.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Noto Sans';src:url('fonts/NotoSans-700.woff2') format('woff2');font-weight:700;font-display:swap}
  *{box-sizing:border-box}
  :root{
    font-family:'Noto Sans',sans-serif;
    color-scheme:light;
    --paper:#f3f0e8;
    --surface:#fffcf6;
    --surface-alt:#f7f3ea;
    --ink:#25231f;
    --muted:#6f6a61;
    --border:#b8b1a4;
    --accent:#d65a31;
    background:var(--paper);
  }
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
  a{color:var(--accent)}
  .layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:10px}
  .sidebar h1{font-size:18px;margin:0 0 6px}
  .sidebar p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
  .sidebar nav{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .doc-link{display:block;padding:8px 10px;border:0;border-radius:2px;background:transparent;color:var(--ink);font:500 13.5px/1.3 'Noto Sans',sans-serif;text-align:left;cursor:pointer;text-decoration:none}
  .doc-link:hover{background:var(--surface-alt)}
  .doc-link.active{background:#f3ded6;font-weight:700}
  .sidebar footer{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.7}
  .content{padding:28px 34px;max-width:920px}
  .content h1{font-size:30px;border-bottom:1px solid var(--border);padding-bottom:8px;margin:0 0 18px}
  .content h2{font-size:22px;margin:28px 0 10px}
  .content h3{font-size:17px;margin:22px 0 8px}
  .content p{margin:10px 0;line-height:1.7}
  .content ul,.content ol{margin:10px 0;padding-left:24px;line-height:1.7}
  .content code{background:var(--paper);border:1px solid #e3ddd0;padding:1px 5px;font-family:'Noto Sans',sans-serif;font-size:.94em}
  .content pre{background:var(--paper);border:1px solid var(--border);padding:12px;overflow:auto;white-space:pre-wrap;font-family:'Noto Sans',sans-serif;font-size:.92em;line-height:1.55}
  .content table{border-collapse:collapse;margin:14px 0;width:100%}
  .content th,.content td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
  .content th{background:var(--paper)}
  .content blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:2px 14px;color:var(--muted)}
  .content hr{border:0;border-top:1px solid var(--border);margin:20px 0}
  .error{color:#b13e3e}
  @media (max-width:820px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>Anlyflad</h1>
    <p>Documentation for the raster and SVG vectorization studio.</p>
    <nav id="doc-nav" aria-label="Documentation pages"></nav>
    <p><a href="index.html">Back to the application</a></p>
    <footer>
      <p>Anlyflad 1.0.0</p>
      <p>Author: Richard Jiang</p>
      <p>License: MIT</p>
    </footer>
  </aside>
  <main class="content" id="doc-content" aria-live="polite"><p>Loading…</p></main>
</div>
<script>
(function () {
  var documents = [
    { id: 'README', title: 'README' },
    { id: 'architecture', title: 'Architecture' },
    { id: 'performance', title: 'Performance' },
    { id: 'teavm', title: 'TeaVM' }
  ];
  var nav = document.getElementById('doc-nav');
  var content = document.getElementById('doc-content');
  function escapeHtml(value) {
    return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function inline(value) {
    var output = escapeHtml(value);
    output = output.replace(/`([^`]+)`/g, '<code>$1</code>');
    output = output.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    output = output.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (match, label, url) {
      var safe = /^(https?:|mailto:|#|\.{0,2}\/|[^:]*$)/.test(url) ? url : '#';
      return '<a href="' + safe + '">' + label + '</a>';
    });
    return output;
  }
  function render(markdown) {
    var lines = markdown.replace(/\r\n?/g, '\n').split('\n');
    var html = [];
    var inCode = false;
    var inList = false;
    var ordered = false;
    var inTable = false;
    var tableHeader = true;
    function closeList() {
      if (inList) { html.push(ordered ? '</ol>' : '</ul>'); inList = false; }
    }
    for (var index = 0; index < lines.length; index++) {
      var line = lines[index];
      var trimmed = line.trim();
      if (line.indexOf('```') === 0) {
        if (inCode) { html.push('</code></pre>'); inCode = false; }
        else { closeList(); html.push('<pre><code>'); inCode = true; }
        continue;
      }
      if (inCode) { html.push(escapeHtml(line) + '\n'); continue; }
      if (!trimmed) { closeList(); inTable = false; continue; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) { closeList(); inTable = false; html.push('<hr>'); continue; }
      var heading = /^(#{1,6})\s+(.*)$/.exec(trimmed);
      if (heading) { closeList(); inTable = false; var level = heading[1].length; html.push('<h' + level + '>' + inline(heading[2]) + '</h' + level + '>'); continue; }
      if (trimmed.charAt(0) === '>') { closeList(); inTable = false; html.push('<blockquote>' + inline(trimmed.slice(1).trim()) + '</blockquote>'); continue; }
      var cells = trimmed.split('|');
      var isTable = trimmed.indexOf('|') >= 0;
      if (isTable && index + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[index + 1])) {
        closeList(); inTable = true; tableHeader = true; html.push('<table>'); continue;
      }
      if (inTable) {
        if (!isTable) { html.push('</table>'); inTable = false; }
        else {
          var row = trimmed.replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (cell) { return cell.trim(); });
          var tag = tableHeader ? 'th' : 'td';
          html.push('<tr>' + row.map(function (cell) { return '<' + tag + '>' + inline(cell) + '</' + tag + '>'; }).join('') + '</tr>');
          tableHeader = false;
          continue;
        }
      }
      if (/^[-*]\s+/.test(trimmed)) {
        if (!inList || ordered) { closeList(); html.push('<ul>'); inList = true; ordered = false; }
        html.push('<li>' + inline(trimmed.slice(2).trim()) + '</li>');
        continue;
      }
      var orderedItem = /^\d+\.\s+(.*)$/.exec(trimmed);
      if (orderedItem) {
        if (!inList || !ordered) { closeList(); html.push('<ol>'); inList = true; ordered = true; }
        html.push('<li>' + inline(orderedItem[1]) + '</li>');
        continue;
      }
      closeList();
      html.push('<p>' + inline(trimmed) + '</p>');
    }
    if (inCode) { html.push('</code></pre>'); }
    if (inTable) { html.push('</table>'); }
    closeList();
    return html.join('\n');
  }
  function load(id) {
    var buttons = nav.querySelectorAll('button');
    for (var index = 0; index < buttons.length; index++) {
      buttons[index].classList.toggle('active', buttons[index].dataset.id === id);
    }
    content.innerHTML = '<p>Loading…</p>';
    fetch('docs/' + id + '.md').then(function (response) {
      if (!response.ok) { throw new Error('Could not load ' + id); }
      return response.text();
    }).then(function (markdown) {
      content.innerHTML = render(markdown);
      content.scrollTop = 0;
      window.scrollTo(0, 0);
    }).catch(function (error) {
      content.innerHTML = '<p class="error">' + escapeHtml(error.message) + '</p>';
    });
  }
  documents.forEach(function (document) {
    var link = window.document.createElement('a');
    link.className = 'doc-link';
    link.href = '?doc=' + encodeURIComponent(document.id);
    link.dataset.id = document.id;
    link.textContent = document.title;
    link.addEventListener('click', function (event) {
      event.preventDefault();
      load(document.id);
      window.history.replaceState(null, '', '?doc=' + encodeURIComponent(document.id));
    });
    nav.appendChild(link);
  });
  var requested = new URLSearchParams(window.location.search).get('doc');
  var known = documents.some(function (document) { return document.id === requested; });
  load(known ? requested : 'README');
})();
</script>
</body>
</html>
